; PlatformIO Project Configuration
; Cil: LaskaKit ESP32-C3-LPKit v4 + MPU6050/6500 garage door PoC.
;
; Struktura:
;   src/main.cpp           ... finalni C3 aplikace (default env: app)
;   debug/<modul>/main.cpp ... samostatne ladici moduly (env per modul)
;
; [env]            = sdileny base pro vsechny C3 env (board, port, USB-CDC flags)
; [env:app]        = finalni aplikace, buildi vse v src/
; [env:c3*]        = debug env, build_src_filter omezuje na 1 soubor v debug/
;
; C3 port: pouzivame glob /dev/ttyACM* (ne pevne ACM0). PIO expanduje glob proti
; enumerovanym serial portum a vezme prvni match. Resi ACM enumeration order
; dokud je zapojeny jen jeden ACM device.

[platformio]
default_envs = app

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*

; uncomment pro filtrování ANSI control chars + timestamp v Serial Monitor
; monitor_filters = esp32_exception_decoder, time, colorize

build_flags =
    -D CORE_DEBUG_LEVEL=3   ; INFO level (0=none, 5=verbose)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

; ---- finalni aplikace ----
; pio run -t upload -t monitor    (buildi src/main.cpp + ostatni src/*.cpp moduly)
[env:app]

; ---- debug: on-board NeoPixel LED test ----
; pio run -e c3led -t upload -t monitor
[env:c3led]
build_src_filter = -<*> +<../debug/c3led/main.cpp>

; ---- debug: WiFi RSSI test (overeni preletovaneho pigtailu) ----
; pio run -e c3wifi -t upload -t monitor
[env:c3wifi]
build_src_filter = -<*> +<../debug/c3wifi/main.cpp>

; ---- debug: MPU6050/6500 bring-up (SDA=GPIO6, SCL=GPIO7) ----
; pio run -e c3mpu -t upload -t monitor
[env:c3mpu]
build_src_filter = -<*> +<../debug/c3mpu/main.cpp>

; ---- debug: power-mereni (deep sleep + WiFi POST cyklus) ----
; Dual log: USB-CDC + UART0 (GPIO20=RX, GPIO21=TX) -> monitorovatelne i bez USB.
; pio run -e c3power -t upload -t monitor
[env:c3power]
build_src_filter = -<*> +<../debug/c3power/main.cpp>

; ---- debug: idle-only sleep (bez WiFi, jen LED + deep sleep) ----
; Cilem je zmerit "ciste" ESP active a sleep proudy bez radia.
; pio run -e c3sleep -t upload -t monitor
[env:c3sleep]
build_src_filter = -<*> +<../debug/c3sleep/main.cpp>
