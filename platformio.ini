; PlatformIO Project Configuration
; FireBeetle ESP32-E V1.0 (DFR0654) + MPU6050 garage door PoC
;
; Struktura:
;   src/main.cpp           ... finalni aplikace (default env)
;   debug/<modul>/main.cpp ... samostatne ladici moduly (env per modul)
;
; Pridani noveho debug modulu:
;   1. mkdir debug/<jmeno> && touch debug/<jmeno>/main.cpp
;   2. pridat [env:<jmeno>] sekci nize s build_src_filter
;   3. pio run -e <jmeno> -t upload -t monitor

[platformio]
default_envs = app

; ---- spolecna konfigurace pro vsechna prostredi ----
[env]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; uncomment pro filtrování ANSI control chars + timestamp v Serial Monitor
; monitor_filters = esp32_exception_decoder, time, colorize

build_flags =
    -D CORE_DEBUG_LEVEL=3   ; INFO level (0=none, 5=verbose)

lib_deps =
    ; zatim zadne, MPU6050 budeme cist primo pres Wire.h

; ---- finalni aplikace ----
; pio run -t upload -t monitor
[env:app]
; default — buildi src/

; ---- debug: WiFi + NTP + ntfy + Vbat status loop ----
; pio run -e ntfy -t upload -t monitor
[env:ntfy]
build_src_filter = -<*> +<../debug/ntfy/main.cpp>

; ---- debug: MPU6050 baseline + tilt monitoring pres Serial ----
; pio run -e tilt -t upload -t monitor
[env:tilt]
build_src_filter = -<*> +<../debug/tilt/main.cpp>

; ---- debug: ESP32 deep sleep + RTC mem persistence ----
; pio run -e sleep -t upload -t monitor
[env:sleep]
build_src_filter = -<*> +<../debug/sleep/main.cpp>

; ---- debug: LaskaKit ESP32-C3-LPKit on-board NeoPixel LED test ----
; Pozn.: jina deska (ESP32-C3 RISC-V) nez FireBeetle (ESP32 Xtensa) z [env].
; pio run -e c3led -t upload -t monitor
[env:c3led]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
build_src_filter = -<*> +<../debug/c3led/main.cpp>

; ---- debug: LaskaKit ESP32-C3 WiFi RSSI test (overeni preletovaneho pigtailu) ----
; pio run -e c3wifi -t upload -t monitor
[env:c3wifi]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
