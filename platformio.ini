    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../debug/c3mpu/main.cpp>

; ---- debug: LaskaKit ESP32-C3 power-mereni (deep sleep + WiFi POST cyklus) ----
; Dual log: USB-CDC + UART0 (GPIO20=RX, GPIO21=TX) -> monitorovatelne i bez USB.
; pio run -e c3power -t upload -t monitor
[env:c3power]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
