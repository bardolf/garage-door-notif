    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
build_src_filter = -<*> +<../debug/c3power/main.cpp>

; ---- debug: LaskaKit ESP32-C3 idle-only sleep (bez WiFi, jen LED + deep sleep) ----
; Cilem je zmerit "ciste" ESP active a sleep proudy bez radia.
; pio run -e c3sleep -t upload -t monitor
[env:c3sleep]
